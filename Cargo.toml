[package]
name = "yashare"
version = "0.1.0"
edition = "2024"
description = "Core library for downloading public Yandex.Disk shares"
license = "MIT OR Apache-2.0"
repository = "https://github.com/serbe/yashare"
keywords = ["yandex", "disk", "download", "public", "share"]
categories = ["network-programming"]

[dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
jiff = { version = "0.2.35", features = ["serde"] }
md-5 = "0.11.0"
rand = { version = "0.10.2", features = ["thread_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "signal"] }
tokio-util = "0.7.19"
urlencoding = "2.1.3"
